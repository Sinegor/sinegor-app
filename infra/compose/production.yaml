# Separate from dev. Always choose an explicit project and private --env-file.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
x-app: &app
  restart: unless-stopped
  init: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  logging: *logging
services:
  postgres:
    image: postgres:16.14@sha256:4b7183ac05f8ef417db21fd72d71047a4238340c261d3cc3ddb6d579ab5071ae
    # SQL error messages can contain values even when statement logging is off.
    command: ["postgres", "-c", "log_min_messages=warning", "-c", "log_min_error_statement=panic", "-c", "log_error_verbosity=terse", "-c", "log_statement=none", "-c", "log_parameter_max_length_on_error=0"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      API_OWNER_PASSWORD: ${API_OWNER_PASSWORD:?required}
      API_DATABASE_PASSWORD: ${API_DATABASE_PASSWORD:?required}
      CMS_DATABASE_PASSWORD: ${CMS_DATABASE_PASSWORD:?required}
      SECURITY_CLEANUP_PASSWORD: ${SECURITY_CLEANUP_PASSWORD:?required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../postgres/init-production.sh:/docker-entrypoint-initdb.d/10-sinegor.sh:ro,z
    networks: [database]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging

  api:
    <<: *app
    image: sinegor-api:${IMAGE_TAG:-local}
    build: ../../apps/api
    env_file: ["${API_ENV_FILE:?required}"]
    environment:
      FORWARDED_ALLOW_IPS: ${PROXY_INTERNAL_IP:-172.30.85.2}
    command: ["python", "-m", "uvicorn", "sinegor.main:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000", "--no-access-log", "--proxy-headers"]
    volumes:
      - agreements:/var/lib/sinegor/agreements
      - destruction:/var/lib/sinegor/destruction
    networks: [database, application, outbound]
    depends_on:
      postgres: {condition: service_healthy}

  # Explicit one-shot operation; never runs automatically with the HTTP server.
  migrate:
    <<: *app
    image: sinegor-api:${IMAGE_TAG:-local}
    profiles: ["tools"]
    restart: "no"
    env_file: ["${API_ENV_FILE:?required}"]
    environment:
      DATABASE_URL: postgresql+psycopg://sinegor_owner:${API_OWNER_PASSWORD:?required}@postgres:5432/sinegor
    command: ["python", "-m", "alembic", "upgrade", "head"]
    networks: [database]
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck: {disable: true}

  cms:
    <<: *app
    image: sinegor-cms:${IMAGE_TAG:-local}
    build: ../../apps/cms
    env_file: ["${CMS_ENV_FILE:?required}"]
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "1337"
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: sinegor_cms
      DATABASE_USERNAME: sinegor_cms
      DATABASE_PASSWORD: ${CMS_DATABASE_PASSWORD:?required}
      CMS_PUBLIC_ORIGIN: ${CMS_PUBLIC_ORIGIN:?required}
      CMS_BEHIND_PROXY: "true"
    volumes: ["cms_uploads:/app/public/uploads"]
    networks: [database, application]
    depends_on:
      postgres: {condition: service_healthy}

  web:
    <<: *app
    image: sinegor-web:${IMAGE_TAG:-local}
    build: ../../apps/web
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?required}
      CMS_ORIGIN: http://cms:1337
      CMS_MEDIA_ORIGIN: ${PUBLIC_ORIGIN:?required}
      API_ORIGIN: http://api:8000
      YANDEX_METRIKA_ENABLED: ${YANDEX_METRIKA_ENABLED:-false}
      YANDEX_METRIKA_ID: ${YANDEX_METRIKA_ID:-}
    networks: [application]
    depends_on:
      cms: {condition: service_healthy}
      api: {condition: service_healthy}

  proxy:
    <<: *app
    image: nginxinc/nginx-unprivileged:1.28.0-alpine@sha256:c97ff0bf7cbae369953c6da1232ec14ad9f971d66360c5698db0856a4cd657a0
    read_only: true
    tmpfs: ["/tmp"]
    ports:
      - "${PROXY_BIND:-127.0.0.1}:${HTTPS_PORT:-8443}:8443"
      - "${PROXY_BIND:-127.0.0.1}:${CMS_HTTPS_PORT:-9443}:9443"
    volumes:
      - ../proxy/nginx.conf:/etc/nginx/nginx.conf:ro,z
      - ${TLS_CERT_FILE:?required}:/etc/nginx/tls/cert.pem:ro,Z
      - ${TLS_KEY_FILE:?required}:/etc/nginx/tls/key.pem:ro,Z
      - ${CMS_CLIENT_CA_FILE:?required}:/etc/nginx/tls/cms-client-ca.pem:ro,Z
    networks:
      application:
        ipv4_address: ${PROXY_INTERNAL_IP:-172.30.85.2}
      edge: {}
    depends_on:
      web: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--no-check-certificate", "--spider", "https://127.0.0.1:8443/proxy-health"]
      interval: 15s
      timeout: 5s
      retries: 5

networks:
  database: {internal: true}
  application:
    internal: true
    # Stable bridge identity also makes host firewall assignment reproducible.
    driver_opts:
      com.docker.network.bridge.name: ${APPLICATION_BRIDGE_NAME:-br-sinegor-app}
    ipam:
      config:
        - subnet: ${APPLICATION_SUBNET:-172.30.85.0/24}
          ip_range: ${APPLICATION_DYNAMIC_RANGE:-172.30.85.128/25}
  edge: {}
  # API needs SMTP/Telegram/Disk in production. Local check overrides this to internal.
  outbound: {}
volumes:
  postgres_data: {}
  cms_uploads: {}
  agreements: {}
  destruction: {}
