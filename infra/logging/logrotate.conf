# Host-file logging: launch API/SSR/proxy/Strapi through scripts/logging/run.py.
# Run daily as the same service user; keep the state file in a private directory.
# Includes empty logs so maxage also runs during quiet periods.
/var/log/sinegor/api.log /var/log/sinegor/web.log /var/log/sinegor/proxy.log /var/log/sinegor/strapi.log {
    daily
    rotate 90
    maxage 90
    dateext
    dateformat -%Y%m%d
    compress
    missingok
    ifempty
    copytruncate
}
