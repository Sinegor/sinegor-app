pid /tmp/nginx.pid;
error_log /dev/stderr crit;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    ssl_certificate /etc/nginx/sinegor-tls/cert.pem;
    ssl_certificate_key /etc/nginx/sinegor-tls/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    client_max_body_size 21m;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Forwarded "";
    proxy_hide_header X-Powered-By;
    resolver 127.0.0.11 valid=5s ipv6=off;
    upstream api_backend {
        zone api_backend 64k;
        server api:8000 resolve;
    }
    upstream web_backend {
        zone web_backend 64k;
        server web:3000 resolve;
    }
    upstream cms_backend {
        zone cms_backend 64k;
        server cms:1337 resolve;
    }
    server {
        listen 127.0.0.1:8081;
        location = /proxy-health { return 204; }
        location / { return 404; }
    }
    server {
        listen 8080 default_server;
        server_name _;
        return 444;
    }
    server {
        listen 8080;
        server_name sinegor-lab.website cms.sinegor-lab.website;
        location ^~ /.well-known/acme-challenge/ {
            limit_except GET { deny all; }
            root /var/www/acme;
            default_type text/plain;
            try_files $uri =404;
        }
        location / { return 308 https://$host$request_uri; }
    }
    server {
        listen 8443 ssl default_server;
        server_name _;
        ssl_reject_handshake on;
        return 444;
    }
    server {
        listen 8443 ssl;
        server_name sinegor-lab.website;
        location = /api { proxy_pass http://api_backend; }
        location ^~ /api/ { proxy_pass http://api_backend; }
        location ^~ /uploads/ {
            limit_except GET { deny all; }
            proxy_pass http://cms_backend;
        }
        location / { proxy_pass http://web_backend; }
    }
    server {
        listen 8443 ssl;
        server_name cms.sinegor-lab.website;
        ssl_client_certificate /etc/nginx/sinegor-ca/cms-client-ca.pem;
        ssl_verify_client optional;
        ssl_verify_depth 2;
        client_max_body_size 128m;
        location = /_health {
            limit_except GET { deny all; }
            proxy_pass http://cms_backend;
        }
        location = /api/public-content/footer {
            limit_except GET { deny all; }
            proxy_pass http://cms_backend;
        }
        location ~ ^/api/public-content/(pages|services|publications|documents)(/[^/]+)?$ {
            limit_except GET { deny all; }
            proxy_pass http://cms_backend;
        }
        location ^~ /uploads/ {
            limit_except GET { deny all; }
            proxy_pass http://cms_backend;
        }
        # Everything outside the narrow read-only public surface needs mTLS.
        # The return-only if cannot forward a rejected request to Strapi.
        location / {
            if ($ssl_client_verify != SUCCESS) { return 403; }
            proxy_pass http://cms_backend;
        }
    }
}
