pid /tmp/nginx.pid;
error_log /dev/stderr crit;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # Raw paths/query, authentication headers and request bodies must never be logged.
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    ssl_certificate /etc/nginx/tls/cert.pem;
    ssl_certificate_key /etc/nginx/tls/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 21m;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $http_host;
    # Client-supplied forwarding headers are never trusted or appended.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Connection "";
    proxy_http_version 1.1;
    proxy_hide_header X-Powered-By;
    # Docker DNS must refresh upstream addresses after independent recreations.
    resolver 127.0.0.11 valid=5s ipv6=off;
    upstream api_backend {
        zone api_backend 64k;
        server api:8000 resolve;
    }
    upstream web_backend {
        zone web_backend 64k;
        server web:3000 resolve;
    }
    upstream cms_backend {
        zone cms_backend 64k;
        server cms:1337 resolve;
    }
    server {
        listen 8443 ssl;
        location = /proxy-health { return 204; }
        location ^~ /api/ { proxy_pass http://api_backend; }
        location ^~ /uploads/ {
            limit_except GET { deny all; }
            proxy_pass http://cms_backend;
        }
        location / { proxy_pass http://web_backend; }
    }
    # TLS client authentication protects the entire CMS surface. It leaves the
    # Authorization header available for Strapi's own Bearer authentication.
    server {
        listen 9443 ssl;
        ssl_client_certificate /etc/nginx/tls/cms-client-ca.pem;
        ssl_verify_client on;
        client_max_body_size 100m;
        location / { proxy_pass http://cms_backend; }
    }
}
